</defs>
<style>
.float{animation:float 6s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 6s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}
.t2{animation-delay:-1.2s}.t3{animation-delay:-2.4s}.t4{animation-delay:-3.6s}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.6s ease-out infinite}
.r2{animation-delay:1.2s}.r3{animation-delay:2.4s}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 3.6s ease-in-out infinite}
.pinbob{animation:pinbob 3s ease-in-out infinite}
.pinshadow{transform-box:fill-box;transform-origin:center;animation:pinshadow 3s ease-in-out infinite}
.flow{stroke-dasharray:2 14;animation:flow 1.1s linear infinite}
.cflow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
.mk{transform-box:fill-box;transform-origin:center;animation:mk 2.8s ease-out infinite}
.m2{animation-delay:.9s}.m3{animation-delay:1.8s}
.knob{animation:knob 4s ease-in-out infinite}
.arc1{animation:arc 1.8s ease-in-out infinite}
.arc2{animation:arc 1.8s ease-in-out infinite;animation-delay:.3s}
.tw1{animation:twinkle 3s ease-in-out infinite}
.tw2{animation:twinkle 4s ease-in-out infinite;animation-delay:-1.3s}
.tw3{animation:twinkle 3.5s ease-in-out infinite;animation-delay:-2.2s}
.tpulse{transform-box:fill-box;transform-origin:center;animation:tpulse 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.65}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ring{0%{transform:scale(.2);opacity:.85}100%{transform:scale(1);opacity:0}}
@keyframes glow{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.08);opacity:1}}
@keyframes pinbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pinshadow{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(.7);opacity:.2}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes mk{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes knob{0%,35%{transform:translateX(0)}50%,85%{transform:translateX(18px)}100%{transform:translateX(0)}}
@keyframes arc{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
