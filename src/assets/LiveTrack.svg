<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>LiveTrack hero illustration</title><desc>A 3D smartphone showing a dark live map with a glowing coral location pin, pulsing GPS rings, route lines and nearby device markers, surrounded by floating share, connected-device, pin and GPS tiles.</desc>
<defs>
<linearGradient id="gPhone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A2735"/><stop offset="0.5" stop-color="#2A1420"/><stop offset="1" stop-color="#160910"/></linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26131C"/><stop offset="1" stop-color="#150A10"/></linearGradient>
<linearGradient id="gPin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A6E"/><stop offset="1" stop-color="#E8443A"/></linearGradient>
<linearGradient id="gTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A1C29"/><stop offset="1" stop-color="#1A0B11"/></linearGradient>
<radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF5A4F" stop-opacity="0.55"/><stop offset="1" stop-color="#FF5A4F" stop-opacity="0"/></radialGradient>
<radialGradient id="gAmb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF5A4F" stop-opacity="0.2"/><stop offset="1" stop-color="#FF5A4F" stop-opacity="0"/></radialGradient>
