<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-label="Shivam, Full Stack Developer">
  <title>Shivam (for light backgrounds)</title>
  <defs>
    <linearGradient id="al-rule-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E02B2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#E02B2B" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="al-rule-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E02B2B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E02B2B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="320" y="150" text-anchor="middle"
        font-family="'Playfair Display','Cormorant Garamond','Bodoni 72','Didot','Baskerville','Georgia',serif"
        font-size="132" font-style="italic" font-weight="500" letter-spacing="-2"
        fill="#0B0507">Shivam<tspan fill="#E02B2B" font-style="normal">.</tspan></text>

  <line x1="130" y1="196" x2="300" y2="196" stroke="url(#al-rule-l)" stroke-width="1.2"/>
  <line x1="340" y1="196" x2="510" y2="196" stroke="url(#al-rule-r)" stroke-width="1.2"/>
  <path d="M320 189 L327 196 L320 203 L313 196 Z" fill="#E02B2B"/>

  <text x="324" y="238" text-anchor="middle"
        font-family="'Montserrat','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="14" font-weight="500" letter-spacing="9" fill="#6B5457">FULL STACK DEVELOPER</text>
</svg>
